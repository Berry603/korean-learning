// SENTENCE QUIZ
// ============================================================
function startSentenceQuiz() {
  var pool = SENTENCES.slice();
  shuffleArray(pool);
  var questions = pool.slice(0, 10);
  if (questions.length === 0) { showToast('没有可测验的句子'); return; }
  sqState = { pool: questions, index: 0, correct: 0, answered: false };
  renderSentenceQuiz();
}

function renderSentenceQuiz() {
  if (!sqState || sqState.index >= sqState.pool.length) {
    if (sqState) {
      var ratio = Math.round(sqState.correct / sqState.pool.length * 100);
      var grade = ratio >= 80 ? 'good' : ratio >= 50 ? 'ok' : 'fail';
      var sqEmoji = ratio >= 80 ? '🎉' : ratio >= 50 ? '👏' : '💪';
      var page = document.getElementById('pageSentences');
      var modal = document.createElement('div');
      modal.className = 'quiz-overlay';
      modal.onclick = function(){ modal.remove(); };
      modal.innerHTML = '<div class="quiz-modal" onclick="event.stopPropagation()"><h3>' + sqEmoji + ' 句子测验结果</h3><div class="quiz-wq-result ' + grade + '"><div class="quiz-wq-score">' + sqState.correct + '/' + sqState.pool.length + '</div>(' + ratio + '%)</div><button class="quiz-wq-close" onclick="this.closest(\'.quiz-overlay\').remove()">关闭</button></div>';
      page.appendChild(modal);
      addPoints(Math.round(sqState.correct / sqState.pool.length * 20));
    }
    sqState = null;
    return;
  }
  var s = sqState.pool[sqState.index];
  sqState.answered = false;
  var wrongs = SENTENCES.filter(function(x){ return x.korean !== s.korean; });
  shuffleArray(wrongs);
  var options = [s.chinese].concat(wrongs.slice(0, 3).map(function(x){ return x.chinese; }));
  shuffleArray(options);
  
  var page = document.getElementById('pageSentences');
  var modal = document.createElement('div');
  modal.className = 'quiz-overlay';
  modal.onclick = function(){ sqState = null; modal.remove(); };
  modal.innerHTML = '<div class="quiz-modal" onclick="event.stopPropagation()"><h3>🎯 句子测验 <span style="font-size:13px;color:var(--text-light)">(' + (sqState.index + 1) + '/' + sqState.pool.length + ')</span></h3><div class="sq-word">' + s.korean + '</div><div class="sq-hint">选择正确的中文翻译</div><div class="quiz-wq-options">' + options.map(function(o){ return '<div class="quiz-wq-opt" onclick="sqAnswer(this,\'' + s.chinese.replace(/'/g,"\\'") + '\')">' + o + '</div>'; }).join('') + '</div></div>';
  page.appendChild(modal);
}

function sqAnswer(el, correct) {
  if (!sqState || sqState.answered) return;
  sqState.answered = true;
  var isRight = el.textContent.trim() === correct.trim();
  if (isRight) { el.classList.add('correct'); sqState.correct++; }
  else {
    el.classList.add('wrong');
    var opts = el.parentElement.querySelectorAll('.quiz-wq-opt');
    opts.forEach(function(o){ if(o.textContent.trim() === correct.trim()) o.classList.add('correct'); });
  }
  sqState.index++;
  setTimeout(function(){
    var overlay = el.closest('.quiz-overlay');
    if (overlay) overlay.remove();
    renderSentenceQuiz();
  }, 1200);
}

  var w = lqState.pool[lqState.index];
  lqState.answered = false;
  var wrongs = WORDS.filter(function(x){ return x.id !== w.id; });
  shuffleArray(wrongs);
  var options = [w.chinese].concat(wrongs.slice(0, 3).map(function(x){ return x.chinese; }));
  shuffleArray(options);
  
  var page = document.getElementById('pageWords');
  var modal = document.createElement('div');
  modal.className = 'quiz-overlay';
  modal.onclick = function(){ lqState = null; modal.remove(); };
  modal.innerHTML = '<div class="quiz-modal" onclick="event.stopPropagation()"><h3>🎧 听力练习 <span style="font-size:13px;color:var(--text-light)">(' + (lqState.index + 1) + '/' + lqState.pool.length + ')</span></h3><div style="text-align:center;padding:10px"><button id="lqPlayBtn" onclick="speak(\'' + w.korean.replace(/'/g,"\\'") + '\');this.textContent=\'🔄 再听一遍\'" style="font-size:44px;background:none;border:none;cursor:pointer;padding:16px">🔊</button></div><div class="sq-hint">听发音，选择正确意思</div><div class="quiz-wq-options">' + options.map(function(o){ return '<div class="quiz-wq-opt" onclick="lqAnswer(this,\'' + w.chinese.replace(/'/g,"\\'") + '\')">' + o + '</div>'; }).join('') + '</div></div>';
  page.appendChild(modal);
  setTimeout(function(){ speak(w.korean); }, 300);
}

function lqAnswer(el, correct) {
  if (!lqState || lqState.answered) return;
  lqState.answered = true;
  var isRight = el.textContent.trim() === correct.trim();
  if (isRight) { el.classList.add('correct'); lqState.correct++; }
  else {
    if (lqState && lqState.pool) addErrorWord(lqState.pool[lqState.index].id);
    el.classList.add('wrong');
    var opts = el.parentElement.querySelectorAll('.quiz-wq-opt');
    opts.forEach(function(o){ if(o.textContent.trim() === correct.trim()) o.classList.add('correct'); });
  }
  lqState.index++;
  setTimeout(function(){
    var overlay = el.closest('.quiz-overlay');
    if (overlay) overlay.remove();
    renderListeningQuiz();
  }, 1500);
}

function startSpellingPractice() {
  var pool = WORDS.slice();
  shuffleArray(pool);
  var questions = pool.slice(0, 10);
  if (questions.length === 0) { showToast('没有可练习的单词'); return; }
  spState = { pool: questions, index: 0, correct: 0, answered: false, hintUsed: false };
  renderSpellingPractice();
}

function renderSpellingPractice() {
  if (!spState || spState.index >= spState.pool.length) {
    if (spState) {
      var ratio = Math.round(spState.correct / spState.pool.length * 100);
      var grade = ratio >= 80 ? 'good' : ratio >= 50 ? 'ok' : 'fail';
      var spEmoji = ratio >= 80 ? '🎉' : ratio >= 50 ? '👏' : '💪';
      var page = document.getElementById('pageWords');
      var modal = document.createElement('div');
      modal.className = 'quiz-overlay';
      modal.onclick = function(){ modal.remove(); };
      modal.innerHTML = '<div class="quiz-modal" onclick="event.stopPropagation()"><h3>' + spEmoji + ' 拼写测验结果</h3><div class="quiz-wq-result ' + grade + '"><div class="quiz-wq-score">' + spState.correct + '/' + spState.pool.length + '</div>(' + ratio + '%)</div><button class="quiz-wq-close" onclick="this.closest(\'.quiz-overlay\').remove()">关闭</button></div>';
      page.appendChild(modal);
      addPoints(Math.round(spState.correct / spState.pool.length * 20));
    }
    spState = null;
    return;
  }
  spState.answered = false;
  spState.hintUsed = spState.hintUsed || false;
  var w = spState.pool[spState.index];
  
  var page = document.getElementById('pageWords');
  var modal = document.createElement('div');
  modal.className = 'quiz-overlay';
  modal.onclick = function(){ spState = null; modal.remove(); };
  modal.innerHTML = '<div class="quiz-modal" onclick="event.stopPropagation()"><h3>✍️ 拼写练习 <span style="font-size:13px;color:var(--text-light)">(' + (spState.index + 1) + '/' + spState.pool.length + ')</span></h3><div class="sq-word" style="font-size:28px;color:#333">' + w.chinese + '</div>' + (spState.hintUsed ? '<div class="sq-hint"><span style="color:#F59E0B">💡 提示: 首字母 ' + w.korean.charAt(0) + '</span></div>' : '<div class="sq-hint"><a href="#" onclick="spShowHint(event)" style="color:var(--text-light)">需要提示?</a></div>') + '<div style="display:flex;gap:8px"><input type="text" id="spInput" placeholder="输入韩语..." style="flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--border);font-size:16px;background:var(--card)" onkeydown="if(event.key===\'Enter\')spSubmit()"><button onclick="spSubmit()" style="padding:10px 20px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-size:15px;cursor:pointer">确定</button></div><div id="spFeedback" style="text-align:center;margin-top:12px;font-size:14px;min-height:20px"></div></div>';
  page.appendChild(modal);
  setTimeout(function(){ var inp = document.getElementById('spInput'); if(inp) inp.focus(); }, 200);
}

function spShowHint(e) {
  if (e) e.preventDefault();
  if (!spState) return;
  spState.hintUsed = true;
  var overlay = document.querySelector('.quiz-overlay');
  if (overlay) overlay.remove();
  renderSpellingPractice();
}

function spSubmit() {
  if (!spState || spState.answered) return;
  spState.answered = true;
  var w = spState.pool[spState.index];
  var input = (document.getElementById('spInput') ? document.getElementById('spInput').value : '') || '';
  input = input.trim();
  var fb = document.getElementById('spFeedback');
  var isRight = input === w.korean;
  if (isRight) {
    fb.innerHTML = '<span style="color:#16A34A">✅ 正确! ' + w.korean + '</span>';
    fb.style.fontWeight = '700';
    spState.correct++;
  } else {
    fb.innerHTML = '<span style="color:#DC2626">❌ 错误</span> 正确答案: <b>' + w.korean + '</b> (' + w.chinese + ')';
  }
  spState.index++;
  setTimeout(function(){
    var overlay = document.querySelector('.quiz-overlay');
    if (overlay) overlay.remove();
    renderSpellingPractice();
  }, 2000);
}

// -- Sentence analysis --
function analyzeKoSentence(korean) {
  var words = korean.split(/\s+/).filter(function(w) { return w.length > 0; });
  var tokens = [];
  var hasSubject = false, hasObject = false;

  // Particle patterns: [regex, primaryRole, altRole]
  // Order matters: longer patterns first to avoid partial matches
  var particleChecks = [
    // Two-char particles
    { re: /^(.+)(에서)$/,    role: 'A' },
    { re: /^(.+)(부터)$/,    role: 'A' },
    { re: /^(.+)(까지)$/,    role: 'A' },
    { re: /^(.+)(보다)$/,    role: 'A' },
    { re: /^(.+)(처럼)$/,    role: 'A' },
    { re: /^(.+)(만큼)$/,    role: 'A' },
    { re: /^(.+)(한테)$/,    role: 'A' },
    { re: /^(.+)(에게)$/,    role: 'A' },
    { re: /^(.+)(께서)$/,    role: 'S' },
    { re: /^(.+)(라고)$/,    role: 'C' },
    { re: /^(.+)(하고)$/,    role: 'C' },
    { re: /^(.+)(이나)$/,    role: 'C' },
    // One-char particles
    { re: /^(.+)(은|는)$/,   role: 'S' },
    { re: /^(.+)(이|가)$/,   role: 'S' },
    { re: /^(.+)(을|를)$/,   role: 'O' },
    { re: /^(.+)(에)$/,      role: 'A' },
    { re: /^(.+)(로)$/,      role: 'A' },
    { re: /^(.+)(의)$/,      role: 'M' },
    { re: /^(.+)(도)$/,      role: 'C' },
    { re: /^(.+)(만)$/,      role: 'C' },
    { re: /^(.+)(와|과)$/,   role: 'C' },
    { re: /^(.+)(랑)$/,      role: 'C' },
  ];

  words.forEach(function(w, idx) {
    var raw = w.replace(/[.?!,~]$/, ''); // trim trailing punctuation
    var stem = raw;
    var particle = '';
    var role = 'M';

    // Try particle extraction
    for (var i = 0; i < particleChecks.length; i++) {
      var m = raw.match(particleChecks[i].re);
      if (m && m[1].length >= 1) {
        stem = m[1];
        particle = m[2];
        role = particleChecks[i].role;
        // Enforce single subject/object
        if (role === 'S') {
          if (hasSubject) { role = 'M'; } else { hasSubject = true; }
        }
        if (role === 'O') {
          if (hasObject) { role = 'M'; } else { hasObject = true; }
        }
        break;
      }
    }

    // Last word: predicate unless already tagged
    if (idx === words.length - 1 && role === 'M') {
      role = 'V';
    }

    tokens.push({ stem: stem, original: raw, role: role, particle: particle });
  });

  // Ensure at least one verb
  if (!tokens.some(function(t) { return t.role === 'V'; }) && tokens.length > 0) {
    tokens[tokens.length - 1].role = 'V';
  }

  return tokens;
}

function makeStructureBar(tokens, korean) {
  var names = { S: '主语', V: '谓语', O: '宾语', A: '状语', C: '补语', M: '修饰' };
  // Deduplicate consecutive same roles
  var parts = [];
  var last = '';
  tokens.forEach(function(t) {
    if (t.role !== last) { parts.push(t.role); last = t.role; }
  });
  var html = parts.map(function(r) {
    return '<span class="str-step ' + r.toLowerCase() + '">' + names[r] + '</span>';
  }).join('<span class="str-arrow">+</span>');
  var speakBtn = korean ? '<span class="str-speak" onclick="event.stopPropagation();speak(\'' + korean.replace(/'/g,"\\'") + '\')" title="听整句发音">🔊</span>' : '';
  return '<div class="str-bar"><span class="str-label">📐 结构：</span>' + html + '<span class="str-hint">← SOV语序</span>' + speakBtn + '</div>';
}

function makeBreakdownHtml(tokens) {
  var names = { S: '主', V: '谓', O: '宾', A: '状', C: '补', M: '修' };
  return tokens.map(function(t) {
    var cls = 'br-tag ' + t.role.toLowerCase();
    var part = t.particle ? '<span class="br-particle">·' + t.particle + '</span>' : '';
    var cn = lookupCN(t.stem);
    var cnHtml = cn ? '<span class="br-cn">' + cn + '</span>' : '';
    var speakIcon = '<span class="br-speak" onclick="event.stopPropagation();speak(\'' + t.original.replace(/'/g,"\\'") + '\')" title="听这个词">🔊</span>';
    return '<div class="br-item">' +
      '<span class="' + cls + '"><span class="br-badge">' + names[t.role] + '</span><span class="br-stem" onclick="event.stopPropagation();speak(\'' + t.stem.replace(/'/g,"\\'") + '\')" title="点我听词">' + t.stem + '</span>' + part + '</span>' +
      speakIcon + cnHtml +
      '</div>';
  }).join('');
}

// -- Quiz logic --
function checkQuiz(id, chosen, el) {
  var g = GRAMMAR.find(function(x) { return x.id === id; });
  if (!g || !g.quiz) return;
  var result = document.getElementById('quizResult' + id);
  var allBtns = el.parentElement.querySelectorAll('.quiz-option');
  if (chosen === g.quiz.answer) {
    el.classList.add('correct');
    result.style.display = 'block';
    result.className = 'quiz-result correct';
    result.innerHTML = '✅ 正确！' + (g.quiz.hint ? ' ' + g.quiz.hint : '');
  } else {
    el.classList.add('wrong');
    result.style.display = 'block';
    result.className = 'quiz-result wrong';
    result.innerHTML = '❌ 不对哦，正确答案是：<b>' + g.quiz.answer + '</b>';
  }
  allBtns.forEach(function(b) { b.style.pointerEvents = 'none'; });
}

function checkFillQuiz(id, answer) {
  var input = document.getElementById('quizInput' + id);
  var result = document.getElementById('quizResult' + id);
  var g = GRAMMAR.find(function(x) { return x.id === id; });
  if (!g || !g.quiz) return;
  var userAnswer = input.value.trim();
  if (userAnswer === '') {
    result.style.display = 'block';
    result.className = 'quiz-result wrong';
    result.innerHTML = '✏️ 请输入你的答案再提交哦~';
  } else if (userAnswer === answer) {
    result.style.display = 'block';
    result.className = 'quiz-result correct';
    result.innerHTML = '✅ 正确！' + (g.quiz.hint ? ' ' + g.quiz.hint : '');
  } else {
    var hint = document.getElementById('quizHint' + id);
    hint.style.display = 'block';
    result.style.display = 'block';
    result.className = 'quiz-result wrong';
    result.innerHTML = '❌ 再试一次！';
  }
}

// Shared streak calculation — used by renderCheckin & doCheckin
function calcStreak() {
  var streak = 0;
  var d = new Date();
  while (true) {
    var ds = d.toISOString().split('T')[0];
    if (appData.checkinRecords[ds]) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}

function renderCheckin() {
  const page = document.getElementById('pageCheckin');
  const todayStr = today();
  const isChecked = !!appData.checkinRecords[todayStr];

  // Calculate streak
  const streak = calcStreak();
  appData.streak = streak;
  saveData(appData);

  // Points for today
  const todayPoints = isChecked ? appData.checkinRecords[todayStr] : Math.min(10 + streak * 10, 60);

  // Calendar
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const weekdays = ['日','一','二','三','四','五','六'];

  let calDays = '';
  // Previous month padding
  for (let i = firstDay - 1; i >= 0; i--) {
    calDays += `<div class="cal-day other-month">${prevDays - i}</div>`;
  }
  // Current month — compute streak level for each day
  var streakMap = {};
  var runningStreak = 0;
  for (var _i = 1; _i <= daysInMonth; _i++) {
    var ds2 = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(_i).padStart(2, '0');
    if (appData.checkinRecords[ds2]) { runningStreak++; streakMap[ds2] = Math.min(runningStreak, 7); }
    else { runningStreak = 0; }
  }
  for (let i = 1; i <= daysInMonth; i++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const isToday = ds === todayStr;
    const isCI = !!appData.checkinRecords[ds];
    const sLevel = streakMap[ds] || 0;
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isCI) cls += ' checked-in streak-lv' + sLevel;
    calDays += `<div class="${cls}">${i}</div>`;
  }

  // Recent history
  const records = Object.entries(appData.checkinRecords).sort((a,b) => b[0].localeCompare(a[0])).slice(0, 7);

  page.innerHTML = `
    <div class="checkin-hero">
      <div class="checkin-circle ${isChecked ? 'checked' : 'unchecked'}" onclick="${isChecked ? '' : 'doCheckin()'}">
        <div class="emoji">${isChecked ? '✅' : '🎯'}</div>
        <div class="text">${isChecked ? '已签到' : '点击签到'}</div>
        <div class="points">${isChecked ? '+' + appData.checkinRecords[todayStr] + ' 积分' : '+' + todayPoints + ' 积分'}</div>
      </div>
    </div>

    <div class="streak-info">
      <div class="streak-item"><div class="num">${streak}</div><div class="lbl">连续签到</div></div>
      <div class="streak-item"><div class="num">${Object.keys(appData.checkinRecords).length}</div><div class="lbl">累计签到</div></div>
      <div class="streak-item"><div class="num">${appData.points}</div><div class="lbl">总积分</div></div>
    </div>

    <div class="calendar-card">
      <div class="calendar-header">
        <h3>${calYear}年 ${monthNames[calMonth]}</h3>
        <div class="calendar-nav">
          <button class="cal-nav-btn" onclick="changeCalMonth(-1)">‹</button>
          <button class="cal-nav-btn" onclick="changeCalMonth(0)">今天</button>
          <button class="cal-nav-btn" onclick="changeCalMonth(1)">›</button>
        </div>
      </div>
      <div class="calendar-weekdays">${weekdays.map(w => `<span>${w}</span>`).join('')}</div>
      <div class="calendar-days">${calDays}</div>
    </div>

    <div class="points-history">
      <h3>📜 最近签到记录</h3>
      ${records.length === 0 ? '<div style="text-align:center;color:var(--text-light);padding:20px;font-size:13px">还没有签到记录</div>' :
        records.map(([date, pts]) => `<div class="history-item"><div class="hi-date">${date}</div><div class="hi-info"><div class="hi-days">第${pts >= 50 ? '5+' : Math.ceil(pts/10)}天连续</div><div class="hi-pts">+${pts} ⭐</div></div></div>`).join('')}
    </div>
  `;
}

function doCheckin() {
  const todayStr = today();
  if (appData.checkinRecords[todayStr]) {
    showToast('今天已经签到过了');
    return;
  }
  // Use shared streak calculation (yesterday's streak, then +1 for today)
  const streak = calcStreak() + 1;
  const points = Math.min(10 + streak * 10, 60);
  appData.checkinRecords[todayStr] = points;
  appData.points += points;
  appData.streak = streak;
  saveData(appData);
  updateHeaderPoints();
  showConfetti();
  showToast(`签到成功！+${points} 积分 🎉`);
  renderCheckin();
}

function changeCalMonth(delta) {
  if (delta === 0) { calMonth = new Date().getMonth(); calYear = new Date().getFullYear(); }
  else { calMonth += delta; if (calMonth > 11) { calMonth = 0; calYear++; } if (calMonth < 0) { calMonth = 11; calYear--; } }
  renderCheckin();
}

}

var CN_KO_INDEX = null;
function buildCnKoIndex() {
  if (CN_KO_INDEX) return;
  CN_KO_INDEX = {};
  var seen = {};
  // 从WORDS构建
  if (typeof WORDS !== 'undefined') {
    for (var i2 = 0; i2 < WORDS.length; i2++) {
      var w = WORDS[i2];
      if (!CN_KO_INDEX[w.chinese]) CN_KO_INDEX[w.chinese] = [];
      if (CN_KO_INDEX[w.chinese].indexOf(w.korean) === -1) {
        CN_KO_INDEX[w.chinese].push(w.korean);
      }
    }
  }
  // 从KO_CN构建
  if (typeof KO_CN !== 'undefined') {
    var keys = Object.keys(KO_CN);
    for (var j2 = 0; j2 < keys.length; j2++) {
      var ko = keys[j2];
      var cn = KO_CN[ko];
      if (!CN_KO_INDEX[cn]) CN_KO_INDEX[cn] = [];
      if (CN_KO_INDEX[cn].indexOf(ko) === -1) {
        CN_KO_INDEX[cn].push(ko);
      }
    }
  }
  // 从短语词典构建（短语也加入索引）
  if (typeof CN_KO_PHRASES !== 'undefined') {
    var phraseKeys = Object.keys(CN_KO_PHRASES);
    for (var p = 0; p < phraseKeys.length; p++) {
      var cnPhrase = phraseKeys[p];
      var koList = CN_KO_PHRASES[cnPhrase];
      if (!CN_KO_INDEX[cnPhrase]) CN_KO_INDEX[cnPhrase] = [];
      for (var r = 0; r < koList.length; r++) {
        if (CN_KO_INDEX[cnPhrase].indexOf(koList[r]) === -1) {
          CN_KO_INDEX[cnPhrase].push(koList[r]);
        }
      }
    }
  }
}

function searchDictionary(query, mode) {
  if (!query || query.length < 1) { return { results: [], suggestions: [] }; }
  var q = query.trim();

  if (mode === 'ko2cn') {
    return searchKo2Cn(q);
  } else {
    return searchCn2Ko(q);
  }
}

function searchKo2Cn(q) {
  var results = [];
  var suggestions = [];
  var seen = {};

  // 1. 精确匹配 KO_CN
  if (KO_CN[q]) {
    results.push({ korean: q, chinese: KO_CN[q], exact: true });
    seen[q] = true;
  }
  // 2. 精确匹配 WORDS
  if (typeof WORDS !== 'undefined') {
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i];
      if (w.korean === q && !seen[w.korean]) {
        results.push({ korean: w.korean, chinese: w.chinese, roman: w.roman, category: w.category, example: w.example, exact: true });
        seen[w.korean] = true;
      }
    }
  }

  // 3. 前缀匹配（suggestions）
  var lowerQ = q.toLowerCase();
  // 从KO_CN找
  var koKeys = Object.keys(KO_CN);
  for (var j = 0; j < koKeys.length; j++) {
    var ko = koKeys[j];
    if (ko === q) continue;
    if (ko.indexOf(q) === 0) {
      if (!seen[ko]) {
        suggestions.push({ korean: ko, chinese: KO_CN[ko] });
        seen[ko] = true;
      }
    }
  }
  // 从WORDS找
  if (typeof WORDS !== 'undefined') {
    for (var k = 0; k < WORDS.length; k++) {
      var w2 = WORDS[k];
      if (w2.korean === q) continue;
      if (w2.korean.indexOf(q) === 0 && !seen[w2.korean]) {
        suggestions.push({ korean: w2.korean, chinese: w2.chinese, roman: w2.roman });
        seen[w2.korean] = true;
      }
    }
  }

  // 4. 包含匹配（如果前缀匹配结果太少，补充包含匹配）
  if (results.length === 0 && suggestions.length < 5) {
    for (var m = 0; m < koKeys.length; m++) {
      var ko2 = koKeys[m];
      if (ko2 === q || seen[ko2]) continue;
      if (ko2.indexOf(q) > 0 && !seen[ko2]) {
        suggestions.push({ korean: ko2, chinese: KO_CN[ko2] });
        seen[ko2] = true;
      }
    }
  }

  return { results: results, suggestions: suggestions.slice(0, 20) };
}

function searchCn2Ko(q) {
  buildCnKoIndex();
  var results = [];
  var suggestions = [];
  var seen = {};

  function addKoResult(ko, cn, isExact, source) {
    if (seen[ko]) return;
    var romanVal = '';
    var catVal = '';
    var exampleVal = '';
    if (typeof WORDS !== 'undefined') {
      for (var w = 0; w < WORDS.length; w++) {
        if (WORDS[w].korean === ko) {
          romanVal = WORDS[w].roman || '';
          catVal = WORDS[w].category || '';
          exampleVal = WORDS[w].example || '';
          break;
        }
      }
    }
    results.push({
      korean: ko, chinese: cn, roman: romanVal,
      category: catVal, example: exampleVal,
      exact: isExact ? true : false, source: source || ''
    });
    seen[ko] = true;
  }

  // ========== 第一步：短语词典精确匹配 ==========
  if (typeof CN_KO_PHRASES !== 'undefined' && CN_KO_PHRASES[q]) {
    var phraseKos = CN_KO_PHRASES[q];
    for (var pi = 0; pi < phraseKos.length; pi++) {
      addKoResult(phraseKos[pi], q, true, '(短语)');
    }
  }

  // ========== 第二步：单词索引精确匹配 ==========
  if (CN_KO_INDEX[q]) {
    var kos = CN_KO_INDEX[q];
    for (var i = 0; i < kos.length; i++) {
      addKoResult(kos[i], q, true, '');
    }
  }

  // ========== 第三步：前缀/包含匹配 ==========
  var cnKeys = Object.keys(CN_KO_INDEX);
  for (var j = 0; j < cnKeys.length; j++) {
    var cn = cnKeys[j];
    if (cn === q) continue;
    var match = false;
    if (cn.indexOf(q) === 0) match = true;
    else if (q.length >= 2 && cn.indexOf(q) !== -1) match = true;
    if (match) {
      var kos2 = CN_KO_INDEX[cn];
      for (var k = 0; k < kos2.length; k++) {
        addKoResult(kos2[k], cn, false, '');
      }
    }
  }

  // ========== 第四步：如果仍然没有结果，尝试分词拆解 ==========
  if (results.length === 0 && q.length >= 3) {
    // 尝试拆成2-3字一组去查
    var chunks = [];
    var chunkSize = Math.min(3, Math.floor(q.length / 2));
    if (chunkSize < 2) chunkSize = 2;
    for (var ci = 0; ci < q.length; ci += chunkSize) {
      var chunk = q.slice(ci, ci + chunkSize);
      if (chunk.length >= 1) chunks.push(chunk);
    }
    // 对每个chunk查找
    var wordHits = [];
    for (var ci2 = 0; ci2 < chunks.length; ci2++) {
      var ch = chunks[ci2];
      if (CN_KO_INDEX[ch]) {
        var chKos = CN_KO_INDEX[ch];
        wordHits.push({ chunk: ch, kos: chKos });
      }
    }
    // 如果找到了拆解结果，组合展示
    if (wordHits.length > 0) {
      // 生成组合翻译建议
      var comboResults = [];
      var comboText = '';
      var allKos = [];
      for (var hi = 0; hi < wordHits.length; hi++) {
        if (hi > 0) comboText += ' + ';
        comboText += wordHits[hi].chunk;
        allKos = allKos.concat(wordHits[hi].kos);
      }
      // 为每个韩语词添加结果，标记为拆解
      for (var ai = 0; ai < allKos.length && ai < 10; ai++) {
        if (!seen[allKos[ai]]) {
          var sourceChunk = '';
          for (var hi2 = 0; hi2 < wordHits.length; hi2++) {
            if (wordHits[hi2].kos.indexOf(allKos[ai]) !== -1) {
              sourceChunk = wordHits[hi2].chunk;
              break;
            }
          }
          addKoResult(allKos[ai], sourceChunk, false, '(拆词)');
        }
      }
      suggestions.push({
        korean: comboText,
        chinese: '(拆分翻译参考)',
        roman: '',
        isHint: true
      });
    }
  }

  return { results: results, suggestions: suggestions };
}

    + '</div>';
}

function initSRS() {
  if (!appData.srsData) appData.srsData = {};
}

function getSRSData(wordId) {
  return appData.srsData[wordId] || { ef: 2.5, interval: 0, reps: 0, nextReview: '' };
}

function updateSRS(wordId, quality) {
  // quality: 0=again, 2=hard, 4=good, 5=easy
  var d = getSRSData(wordId);
  if (quality < 3) { d.reps = 0; d.interval = 1; }
  else if (d.reps === 0) { d.interval = 1; }
  else if (d.reps === 1) { d.interval = 3; }
  else { d.interval = Math.round(d.interval * d.ef); }
  d.reps++;
  d.ef = Math.max(1.3, d.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  var next = new Date();
  next.setDate(next.getDate() + d.interval);
  d.nextReview = next.toISOString().split('T')[0];
  appData.srsData[wordId] = d;
  saveData(appData);
}

function getSRSReviewWords() {
  var today = new Date().toISOString().split('T')[0];
  var reviewIds = [];
  var newIds = [];
  WORDS.forEach(function(w) {
    var d = getSRSData(w.id);
    if (!d.nextReview) { newIds.push(w.id); }
    else if (d.nextReview <= today) { reviewIds.push(w.id); }
  });
  // Return new words first, then due reviews; limit to 20
  return newIds.concat(reviewIds).slice(0, 20);
}

var srsQueue = [];
var srsIndex = 0;
var srsTodayCount = 0;

function startSRS() {
  reviewMode = 'srs';
  srsQueue = getSRSReviewWords();
  srsIndex = 0; srsTodayCount = 0;
  if (srsQueue.length === 0) {
    document.getElementById('reviewContent').innerHTML = '<div class="error-empty"><div style="font-size:48px">🎉</div><div style="font-size:16px;font-weight:600;margin:8px 0">今天没有需要复习的单词</div><div style="color:var(--text-secondary)">明天再来吧！</div></div>';
    renderReviewNav();
    return;
  }
  renderSRSCard();
  renderReviewNav();
}

function renderSRSCard() {
  if (srsIndex >= srsQueue.length) {
    document.getElementById('reviewContent').innerHTML = '<div class="error-empty"><div style="font-size:48px">🎊</div><div style="font-size:16px;font-weight:600;margin:8px 0">复习完成！</div><div style="color:var(--text-secondary)">今天复习了 ' + srsTodayCount + ' 个单词</div><button class="qs-start-btn" onclick="startSRS()" style="margin-top:16px">再来一轮</button></div>';
    appData.srsStreak = (appData.srsStreak || 0) + 1;
    saveData(appData);
    return;
  }
  var w = WORDS.find(function(x) { return x.id === srsQueue[srsIndex]; });
  if (!w) { srsIndex++; renderSRSCard(); return; }
  var d = getSRSData(w.id);
  var page = document.getElementById('reviewContent');
  page.innerHTML = '<div style="margin-bottom:12px;text-align:center;font-size:13px;color:var(--text-secondary)">间隔重复 · SRS 复习 <span style="font-weight:600;color:var(--primary)">' + (srsIndex + 1) + '/' + srsQueue.length + '</span></div>'
    + '<div class="srs-card" id="srsCard" onclick="revealSRS()">'
    + '<div class="srs-korean">' + w.korean + '</div>'
    + '<div class="srs-roman">[' + w.roman + ']</div>'
    + '<div class="srs-reveal">' + w.chinese + '</div>'
    + '<div class="srs-tap-hint">👆 点击显示释义</div>'
    + '<div class="srs-example" style="display:none">' + (w.example || '') + '</div>'
    + '</div>'
    + '<div class="srs-actions" id="srsActions" style="display:none">'
    + '<button class="srs-btn again" onclick="rateSRS(0)">😰 再练</button>'
    + '<button class="srs-btn hard" onclick="rateSRS(2)">🤔 较难</button>'
    + '<button class="srs-btn good" onclick="rateSRS(4)">😊 良好</button>'
    + '<button class="srs-btn easy" onclick="rateSRS(5)">😎 简单</button>'

    + '<div class="srs-stats"><span>🔁 复习' + (d.reps||0) + '次</span><span>📅 间隔' + (d.interval||0) + '天</span></div>';
}

function revealSRS() {
  document.getElementById('srsCard').classList.add('revealed');
  document.getElementById('srsCard').querySelector('.srs-example').style.display = 'block';
  document.getElementById('srsActions').style.display = 'flex';
}

function rateSRS(quality) {
  updateSRS(srsQueue[srsIndex], quality);
  srsTodayCount++;
  srsIndex++;
  renderSRSCard();
}

function addErrorWord(wordId) {
  if (!appData.errorWords) appData.errorWords = {};
  appData.errorWords[wordId] = (appData.errorWords[wordId] || 0) + 1;
  saveData(appData);
}

function clearErrorWord(wordId) {
  if (!appData.errorWords) return;
  delete appData.errorWords[wordId];
  saveData(appData);
  renderErrorReview();
}

function startErrorReview() {
  reviewMode = 'error';
  if (!appData.errorWords || Object.keys(appData.errorWords).length === 0) {
    document.getElementById('reviewContent').innerHTML = '<div class="error-empty"><div style="font-size:48px">✨</div><div style="font-size:16px;font-weight:600;margin:8px 0">没有错题记录</div><div style="color:var(--text-secondary)">做几次测验后就有啦！</div></div>';
    renderReviewNav();
    return;
  }
  renderErrorReview();
  renderReviewNav();
}

function renderErrorReview() {
  if (!appData.errorWords || Object.keys(appData.errorWords).length === 0) {
    startErrorReview(); return;
  }
  var entries = Object.entries(appData.errorWords).sort(function(a,b) { return b[1] - a[1]; });
  var page = document.getElementById('reviewContent');
  var html = '<div style="margin-bottom:12px;font-size:14px;font-weight:600">❌ 错题本 (' + entries.length + '词)</div>'
    + '<button class="qs-start-btn" onclick="startErrorQuiz()" style="margin-bottom:16px">🎯 开始错题测验</button>'
    + '<div class="error-list">';
  entries.forEach(function(e) {
    var w = WORDS.find(function(x) { return x.id === e[0]; });
    if (!w) return;
    html += '<div class="error-item"><div><div class="ei-korean">' + w.korean + '</div><div class="ei-chinese">' + w.chinese + ' [' + w.roman + ']</div></div>'
      + '<div class="ei-count">错' + e[1] + '次</div>'
      + '<button onclick="clearErrorWord(\'' + w.id + '\')" style="background:none;border:none;font-size:16px;cursor:pointer">🗑️</button></div>';
  });
  html += '</div>';
  page.innerHTML = html;
}

var errorQuizState = { words: [], index: 0, score: 0, total: 0 };

function startErrorQuiz() {
  var wids = Object.keys(appData.errorWords || {});
  errorQuizState.words = wids.map(function(id) { return WORDS.find(function(w) { return w.id === id; }); }).filter(Boolean);
  errorQuizState.index = 0; errorQuizState.score = 0;
  errorQuizState.total = Math.min(errorQuizState.words.length, 10);
  // Shuffle
  for (var i = errorQuizState.words.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = errorQuizState.words[i]; errorQuizState.words[i] = errorQuizState.words[j]; errorQuizState.words[j] = tmp;
  }
  errorQuizState.words = errorQuizState.words.slice(0, errorQuizState.total);
  showErrorQuizQuestion();
}

function showErrorQuizQuestion() {
  if (errorQuizState.index >= errorQuizState.total) {
    document.getElementById('reviewContent').innerHTML = '<div class="error-empty"><div style="font-size:48px">🏆</div><div style="font-size:18px;font-weight:600;margin:8px 0">错题测验完成！</div><div style="font-size:24px;font-weight:700;color:var(--primary)">' + errorQuizState.score + '/' + errorQuizState.total + '</div><button class="qs-start-btn" onclick="renderErrorReview()" style="margin-top:16px">返回</button></div>';
    return;
  }
  var w = errorQuizState.words[errorQuizState.index];
  var others = WORDS.filter(function(x) { return x.id !== w.id; }).sort(function() { return Math.random() - 0.5; }).slice(0, 3);
  var opts = [w].concat(others).sort(function() { return Math.random() - 0.5; });
  var page = document.getElementById('reviewContent');
  page.innerHTML = '<div style="text-align:center;margin-bottom:8px;font-size:13px;color:var(--text-secondary)">' + (errorQuizState.index + 1) + '/' + errorQuizState.total + '</div>'
    + '<div style="text-align:center;font-size:32px;font-weight:700;margin:20px 0">' + w.korean + '</div>'
    + '<div style="text-align:center;font-size:14px;color:var(--text-light);margin-bottom:16px">[' + w.roman + ']</div>'
    + '<div style="display:flex;flex-direction:column;gap:8px">'
    + opts.map(function(o, i) {
      return '<button class="quiz-option" onclick="checkErrorAnswer(\'' + w.id + '\',\'' + o.id + '\',this)" data-correct="' + (o.id === w.id) + '">' + o.chinese + '</button>';
    }).join('')
    + '</div>';
}

function checkErrorAnswer(correctId, chosenId, btn) {
  var correct = correctId === chosenId;
  btn.style.background = correct ? 'var(--success)' : 'var(--danger)';
  btn.style.color = '#fff';
  if (correct) { errorQuizState.score++; clearErrorWord(correctId); }
  setTimeout(function() { errorQuizState.index++; showErrorQuizQuestion(); }, 600);
}

var fcQueue = []; var fcIndex = 0; var fcKnown = 0; var fcUnknown = 0;

function startFlashcard() {
  reviewMode = 'flashcard';
  fcQueue = WORDS.filter(function(w) { return !appData.masteredWords.includes(w.id); });
  if (fcQueue.length === 0) {
    fcQueue = WORDS.slice();
  }
  // Shuffle
  for (var i = fcQueue.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = fcQueue[i]; fcQueue[i] = fcQueue[j]; fcQueue[j] = t; }
  fcQueue = fcQueue.slice(0, 20);
  fcIndex = 0; fcKnown = 0; fcUnknown = 0;
  renderFlashcard();
  renderReviewNav();
}

function renderFlashcard() {
  if (fcIndex >= fcQueue.length) {
    document.getElementById('reviewContent').innerHTML = '<div class="error-empty"><div style="font-size:48px">📊</div><div style="font-size:18px;font-weight:600;margin:8px 0">闪卡复习完成！</div><div style="display:flex;gap:24px;justify-content:center;margin:16px 0"><div style="text-align:center"><div style="font-size:28px;color:#10B981">' + fcKnown + '</div><div style="font-size:12px;color:var(--text-secondary)">认识</div></div><div style="text-align:center"><div style="font-size:28px;color:#EF4444">' + fcUnknown + '</div><div style="font-size:12px;color:var(--text-secondary)">不认识</div></div></div><button class="qs-start-btn" onclick="startFlashcard()" style="margin-top:8px">再来一轮</button></div>';
    return;
  }
  var w = fcQueue[fcIndex];
  var page = document.getElementById('reviewContent');
  page.innerHTML = '<div style="text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:8px">闪卡 ' + (fcIndex + 1) + '/' + fcQueue.length + '</div>'
    + '<div class="flashcard" id="fcCard" onclick="flipFlashcard()">'
    + '<div class="fc-korean">' + w.korean + '</div>'
    + '<div class="fc-roman">[' + w.roman + ']</div>'
    + '<div class="fc-chinese">' + w.chinese + '</div>'
    + '<div style="font-size:12px;color:var(--text-light);margin-top:8px">👆 点击翻转</div>'
    + '</div>'
    + '<div class="fc-actions">'
    + '<button class="fc-btn unknown" onclick="swipeFlashcard(false)">✕</button>'
    + '<button class="fc-btn known" onclick="swipeFlashcard(true)">✓</button>'
    + '</div>';
}

function flipFlashcard() {
  document.getElementById('fcCard').classList.toggle('flipped');
}

function swipeFlashcard(known) {
  var card = document.getElementById('fcCard');
  card.classList.add(known ? 'swiping-right' : 'swiping-left');
  if (known) {
    fcKnown++;
    if (!appData.masteredWords.includes(fcQueue[fcIndex].id)) {
      appData.masteredWords.push(fcQueue[fcIndex].id);
    }
  } else { fcUnknown++; addErrorWord(fcQueue[fcIndex].id); }
  saveData(appData);
  setTimeout(function() { fcIndex++; renderFlashcard(); }, 300);
}

function setQuizLength(n) { quizSettings.length = n; renderQuizSettings(); }
function setQuizType(t) { quizSettings.type = t; renderQuizSettings(); }

function startCustomQuiz() {
  var pool = WORDS.slice();
  // Shuffle
  for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  pool = pool.slice(0, quizSettings.length);
  
  if (quizSettings.type === 'meaning') {
    startCustomMeaningQuiz(pool);
  } else if (quizSettings.type === 'listening') {
    startCustomListeningQuiz(pool);
  } else if (quizSettings.type === 'spelling') {
    startCustomSpellingQuiz(pool);
  } else if (quizSettings.type === 'sentence') {
    startCustomSentenceQuiz();
  }
}

var customQuizState = { pool: [], index: 0, score: 0 };

function startCustomMeaningQuiz(pool) {
  customQuizState = { pool: pool, index: 0, score: 0, total: pool.length };
  showCustomMeaningQuestion();

function showCustomMeaningQuestion() {

function checkSpellAnswer(wid) {
  var input = document.getElementById('spellInput');
  var w = WORDS.find(function(x) { return x.id === wid; });
  if (!w) return;
  var value = (input.value || '').trim();
  var correct = value === w.korean;
  var hint = document.getElementById('spellHint');
  hint.innerHTML = correct ? '✅ 正确！' : '❌ 正确答案：<b>' + w.korean + '</b> [' + w.roman + ']';
  hint.style.color = correct ? 'var(--success)' : 'var(--danger)';
  if (correct) { customQuizState.score++; } else { addErrorWord(wid); }
  input.disabled = true;
  setTimeout(function() { customQuizState.index++; showCustomSpellingQuestion(); }, 800);
}

function startCustomSentenceQuiz() {
  var pool = SENTENCES.slice();
  for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  pool = pool.slice(0, quizSettings.length);
  customQuizState = { pool: pool, index: 0, score: 0, total: pool.length };
  showCustomSentenceQuestion();
}

  if (customQuizState.index >= customQuizState.total) { showCustomQuizResult(); return; }
  var s = customQuizState.pool[customQuizState.index];

function checkCustomSentenceAnswer(correctId, chosenId, btn) {

function showCustomQuizResult() {
  var pct = Math.round(customQuizState.score / customQuizState.total * 100);

var listenState = { words: [], index: 0, loop: 3, loopNow: 0, cats: [], running: false, paused: false };

function startListenSetup() {
  reviewMode = 'listen';
  var page = document.getElementById('reviewContent');

  }).join('');

    + '<h3>\uD83C\uDFA7 \u9009\u62E9\u5206\u7C7B & \u5FAA\u73AF\u904D\u6570</h3>'
    + '<div class="listen-select-row"><a onclick="listenSelectAll()">\u5168\u9009</a> &middot; <a onclick="listenSelectNone()">\u5168\u4E0D\u9009</a></div>'
    + '<div class="listen-cats" id="listenCats">' + catsHTML + '</div>'
    + '<div class="listen-loop-row">'
    + '<label>\u5FAA\u73AF</label>'
    + '<select id="listenLoop" onchange="listenState.loop=parseInt(this.value)">'
    + '<option value="1">1 \u904D</option>'
    + '<option value="2">2 \u904D</option>'
    + '<option value="3" selected>3 \u904D</option>'

    + '<option value="10">10 \u904D</option>'
    + '</select>'
    + '</div>'

    + '</div>';
  renderReviewNav();
}

function toggleListenCat(el) {
  el.classList.toggle('active');
  var cat = el.getAttribute('data-cat');
  var idx = listenState.cats.indexOf(cat);
  if (idx === -1) listenState.cats.push(cat);
  else listenState.cats.splice(idx, 1);
}

function listenSelectAll() {
  var els = document.querySelectorAll('#listenCats .listen-cat');
  for (var i = 0; i < els.length; i++) els[i].classList.add('active');
  listenState.cats = CATEGORIES.map(function(c) { return c.name; });
}

function listenSelectNone() {
  var els = document.querySelectorAll('#listenCats .listen-cat');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('active');
  listenState.cats = [];
}

function startListenPlay() {
  if (listenState.cats.length === 0) { alert('\u8BF7\u81F3\u5C11\u9009\u62E9\u4E00\u4E2A\u5206\u7C7B\uFF01'); return; }
  var pool = [];
  listenState.cats.forEach(function(cat) {
    WORDS.forEach(function(w) { if (w.category === cat) pool.push(w); });
  });
  if (pool.length === 0) { alert('\u6240\u9009\u5206\u7C7B\u6CA1\u6709\u5355\u8BCD\uFF01'); return; }
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  listenState.words = pool;
  listenState.index = 0;
  listenState.loopNow = 0;
  listenState.loop = parseInt(document.getElementById('listenLoop').value) || 3;
  listenState.running = true;
  listenState.paused = false;
  renderListenCard();
  speakWordAndChinese();
}

function renderListenCard() {
  var page = document.getElementById('reviewContent');
  var w = listenState.words[listenState.index];
  var totalWords = listenState.words.length;
  var currentGlobal = listenState.loopNow * totalWords + listenState.index + 1;
  var totalGlobal = listenState.loop * totalWords;
  var ctrls;
  if (!listenState.paused) {
    ctrls = '<button class="listen-btn pause" onclick="pauseListening()">\u23F8 \u6682\u505C</button>'
      + '<button class="listen-btn stop" onclick="stopListening()">\u23F9 \u505C\u6B62</button>';
  } else {
    ctrls = '<button class="listen-btn resume" onclick="resumeListening()">\u25B6 \u7EE7\u7EED</button>'
      + '<button class="listen-btn next" onclick="skipListenWord()">\u23ED \u8DF3\u8FC7</button>'
      + '<button class="listen-btn stop" onclick="stopListening()">\u23F9 \u505C\u6B62</button>';
  }
  page.innerHTML = '<div class="listen-progress">'
    + '\u7B2C <span>' + (listenState.loopNow + 1) + '</span>/' + listenState.loop + ' \u904D &middot; \u8BCD <span>' + (listenState.index + 1) + '</span>/' + totalWords
    + ' &middot; \u603B\u8FDB\u5EA6 <span>' + currentGlobal + '</span>/' + totalGlobal
    + '</div>'
    + '<div class="listen-card">'
    + '<div class="listen-korean">' + escapeHtml(w.korean) + '</div>'
    + '<div class="listen-roman">[' + escapeHtml(w.roman) + ']</div>'
    + '<div class="listen-chinese">' + escapeHtml(w.chinese) + '</div>'
    + (w.example ? '<div style="font-size:12px;color:var(--text-tertiary);margin-top:4px">' + escapeHtml(w.example) + '</div>' : '')
    + '</div>'
    + '<div class="listen-ctrls">' + ctrls + '</div>'
    + '<div class="listen-status" id="listenStatus">' + (listenState.paused ? '\u23F8 \u5DF2\u6682\u505C' : '\u{1F50A} \u6B63\u5728\u6717\u8BFB...') + '</div>';
}

function speakWordAndChinese() {
  if (!listenState.running || listenState.paused) return;
  var w = listenState.words[listenState.index];
  var statusEl = document.getElementById('listenStatus');
  if (statusEl) statusEl.textContent = '\u{1F1F0}\u{1F1F7} \u97E9\u8BED\u6717\u8BFB\u4E2D...';
  speakWithCallback(w.korean, 'ko-KR', function() {
    if (!listenState.running || listenState.paused) return;
    if (statusEl) statusEl.textContent = '\u{1F1E8}\u{1F1F3} \u4E2D\u6587\u7FFB\u8BD1...';
    speakWithCallback(w.chinese, 'zh-CN', function() {
      if (!listenState.running || listenState.paused) return;
      if (statusEl) statusEl.textContent = '';
      listenAdvance();
    });
  });
}

function speakWithCallback(text, lang, callback) {
  if (!('speechSynthesis' in window)) {
    setTimeout(callback, 1500);
    return;
  }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.85;
  u.pitch = 1;
  u.volume = 1;
  var voices = speechSynthesis.getVoices();
  var v;
  if (lang === 'ko-KR') v = voices.find(function(x) { return x.lang && x.lang.startsWith('ko'); });
  else v = voices.find(function(x) { return x.lang && x.lang.startsWith('zh'); });
  if (v) u.voice = v;
  var done = false;
  u.onend = function() { if (!done) { done = true; if (callback) callback(); } };
  u.onerror = function() { if (!done) { done = true; if (callback) setTimeout(callback, 800); } };
  var estimated = Math.max(text.length * 80, 2000);
  var safety = setTimeout(function() { if (!done) { done = true; if (callback) callback(); } }, estimated);
  u.addEventListener('end', function() { clearTimeout(safety); });
  u.addEventListener('error', function() { clearTimeout(safety); });
  speechSynthesis.speak(u);
}

function listenAdvance() {
  listenState.index++;
  if (listenState.index >= listenState.words.length) {
    listenState.index = 0;
    listenState.loopNow++;
    if (listenState.loopNow >= listenState.loop) { listenFinish(); return; }
  }
  renderListenCard();
  speakWordAndChinese();
}

function pauseListening() {
  listenState.paused = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  renderListenCard();
  var s = document.getElementById('listenStatus');
  if (s) s.textContent = '\u23F8 \u5DF2\u6682\u505C';
}

function resumeListening() {
  listenState.paused = false;
  renderListenCard();
  speakWordAndChinese();
}

function skipListenWord() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  setTimeout(function() { listenAdvance(); }, 100);
}

function stopListening() {
  listenState.running = false;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  var page = document.getElementById('reviewContent');
  page.innerHTML = '<div class="error-empty">'
    + '<div style="font-size:48px">\u23F9</div>'
    + '<div style="font-size:16px;font-weight:600;margin:8px 0">\u64AD\u653E\u5DF2\u505C\u6B62</div>'
    + '<div style="color:var(--text-secondary);font-size:14px">\u5DF2\u5B8C\u6210 ' + listenState.loopNow + '/' + listenState.loop + ' \u904D</div>'
    + '<button class="qs-start-btn" onclick="startListenSetup()" style="margin-top:12px">\u91CD\u65B0\u8BBE\u7F6E</button>'
    + '<button class="qs-start-btn" onclick="startListenPlay()" style="margin-top:8px;margin-left:8px;background:var(--bg);color:var(--text);border:1px solid var(--border)">\u7EE7\u7EED\u64AD\u653E</button>'
    + '</div>';
}

function listenFinish() {
  listenState.running = false;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  var page = document.getElementById('reviewContent');
  page.innerHTML = '<div class="error-empty">'
    + '<div style="font-size:48px">\uD83C\uDF89</div>'
    + '<div style="font-size:18px;font-weight:600;margin:8px 0">\u542C\u5B8C\u4E86\uFF01</div>'
    + '<div style="font-size:24px;font-weight:700;color:var(--primary);margin:8px 0">' + listenState.words.length + ' \u8BCD &times; ' + listenState.loop + ' \u904D</div>'
    + '<div style="color:var(--text-secondary);font-size:14px">\u5171 ' + (listenState.words.length * listenState.loop) + ' \u6B21\u6717\u8BFB</div>'
    + '<button class="qs-start-btn" onclick="startListenSetup()" style="margin-top:16px">\u91CD\u65B0\u8BBE\u7F6E</button>'
    + '<button class="qs-start-btn" onclick="startListenPlay()" style="margin-top:8px;margin-left:8px;background:var(--bg);color:var(--text);border:1px solid var(--border)">\u518D\u6765\u4E00\u8F6E</button>'
    + '</div>';
}

    + '</div>'

    + '</div>'

    + '</div>';
  renderReviewNav();

function generateTopikQuestions(n) {
  var questions = [];
  var pool = [];

  // 1. Vocabulary questions (40%)
  var vocabCount = Math.floor(n * 0.4);
  var vocabPool = [];
  // Pick random words with at least 2 syllables
  for (var i = 0; i < WORDS.length; i++) {
    if (WORDS[i].ko.length >= 2) vocabPool.push(i);
  }
  shuffle(vocabPool);
  for (var v = 0; v < Math.min(vocabCount, vocabPool.length); v++) {
    var w = WORDS[vocabPool[v]];
    var distractors = [];
    var used = [vocabPool[v]];
    // Pick 3 random distractors
    while (distractors.length < 3) {
      var ri = Math.floor(Math.random() * WORDS.length);
      if (used.indexOf(ri) === -1 && WORDS[ri].ko !== w.ko) {
        distractors.push(WORDS[ri].mean);
        used.push(ri);
      }
    }
    var options = [w.mean].concat(distractors);
    shuffle(options);
    var correctIdx = options.indexOf(w.mean);
    questions.push({
      type: 'vocab', category: '词汇',
      q: w.ko + ' 的意思是？',
      ko: w.ko, roman: w.roman || '',
      options: options, ans: correctIdx,
      correctText: w.mean
    });
  }

  // 2. Grammar questions (30%)
  var gramCount = Math.floor(n * 0.3);
  var gramPool = [];
  for (var g = 0; g < GRAMMAR.length; g++) gramPool.push(g);
  shuffle(gramPool);
  for (var g2 = 0; g2 < Math.min(gramCount, gramPool.length); g2++) {
    var gm = GRAMMAR[gramPool[g2]];
    // Use the existing quiz if available, otherwise create one
    if (gm.quiz) {
      if (gm.quiz.type === 'fill') {
        questions.push({
          type: 'grammar', category: '语法 · ' + gm.category,
          q: gm.quiz.question,
          ko: gm.quiz.answer,
          options: [],
          ans: 0,
          correctText: gm.quiz.answer,
          hint: gm.quiz.hint || '',
          pattern: gm.pattern
        });
      } else if (gm.quiz.type === 'choice') {
        questions.push({
          type: 'grammar', category: '语法 · ' + gm.category,
          q: gm.quiz.question,
          ko: '',
          options: gm.quiz.options,
          ans: gm.quiz.options.indexOf(gm.quiz.answer),
          correctText: gm.quiz.answer,
          pattern: gm.pattern
        });
      }
    }
  }

  // 3. Reading comprehension (30%) - use READINGS questions
  var readCount = n - questions.length;
  if (readCount > 0) {
    var readPool = [];
    for (var r = 0; r < READINGS.length; r++) {
      for (var q = 0; q < READINGS[r].questions.length; q++) {
        readPool.push({r: r, q: q});
      }
    }
    shuffle(readPool);
    for (var r2 = 0; r2 < Math.min(readCount, readPool.length); r2++) {
      var rq = readPool[r2];
      var rd = READINGS[rq.r];
      var rqq = rd.questions[rq.q];
      questions.push({
        type: 'reading', category: '阅读 · ' + rd.level + ' · ' + rd.title_cn,
        q: rqq.q,
        context: rd.text.substring(0, 200) + '...',
        ko: '',
        options: rqq.opts,
        ans: rqq.ans,
        correctText: rqq.opts[rqq.ans],
        passageTitle: rd.title
      });
    }
  }

  // Make sure we have exactly n questions
  questions = questions.slice(0, n);
  shuffle(questions);

  // Renumber
  for (var qi = 0; qi < questions.length; qi++) {
    questions[qi].num = qi + 1;
  }
  return questions;
}

function startTopikTest() {
  topikState.questions = generateTopikQuestions(topikState.total);
  topikState.idx = 0;
  topikState.answers = new Array(topikState.questions.length).fill(-1);
  topikState.started = true;
  renderTopikQuestion();
}

function renderTopikQuestion() {
  var page = document.getElementById('reviewContent');
  var q = topikState.questions[topikState.idx];
  var total = topikState.questions.length;
  var progress = Math.round((topikState.idx / total) * 100);

  var html = '';
  // Progress bar
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">';
  html += '<span style="font-size:12px;color:var(--text-light)">第 ' + (topikState.idx + 1) + '/' + total + ' 题</span>';
  html += '<div style="flex:1;height:6px;background:var(--border);border-radius:3px"><div style="height:6px;background:var(--primary);border-radius:3px;width:' + progress + '%"></div></div>';
  html += '<span style="font-size:11px;background:' + (q.type === 'vocab' ? '#e3f2fd' : q.type === 'grammar' ? '#fff3e0' : '#e8f5e9') + ';padding:2px 8px;border-radius:10px">' + q.category + '</span>';
  html += '</div>';

  // Question card
  html += '<div style="background:var(--card);border-radius:var(--radius);padding:20px">';

  // If it's a reading question, show context
  if (q.type === 'reading') {
    html += '<div style="font-size:12px;color:var(--text-light);margin-bottom:4px">📖 ' + q.passageTitle + '</div>';
    html += '<div style="font-size:12px;background:var(--bg);padding:10px;border-radius:8px;margin-bottom:12px;line-height:1.6;max-height:120px;overflow-y:auto">' + q.context + '</div>';
  }

  // For vocabulary type, show the word with romanization
  if (q.type === 'vocab') {
    html += '<div style="text-align:center;margin-bottom:8px">';
    html += '<div style="font-size:28px;font-weight:700;margin-bottom:4px">' + q.ko + '</div>';
    if (q.roman) html += '<div style="font-size:13px;color:var(--text-light);font-style:italic">' + q.roman + '</div>';
    html += '<span onclick="speak(\'' + q.ko.replace(/'/g,"\\'") + '\')" style="cursor:pointer;font-size:20px" title="听发音">🔊</span>';
    html += '</div>';
  }

  html += '<div style="font-size:16px;font-weight:600;margin-bottom:16px">' + q.num + '. ' + q.q + '</div>';

  // Grammar fill-in-the-blank
  if (q.type === 'grammar' && q.options.length === 0) {
    html += '<div style="margin-bottom:12px">';
    if (q.pattern) html += '<div style="font-size:12px;color:var(--text-light);margin-bottom:4px">语法点：' + q.pattern + '</div>';
    if (q.hint) html += '<div style="font-size:12px;color:var(--warning);margin-bottom:8px">💡 ' + q.hint + '</div>';
    html += '<input type="text" id="topikFillInput" placeholder="输入你的答案..." style="width:100%;padding:12px 16px;font-size:16px;border:2px solid var(--border);border-radius:12px;background:var(--bg);box-sizing:border-box">';
    html += '</div>';
    html += '<button class="qs-start-btn" onclick="submitTopikFill()" style="width:100%">提交答案</button>';
  }

  // Multiple choice
  if (q.options.length > 0) {
    html += '<div style="display:flex;flex-direction:column;gap:10px">';
    var labels = ['A', 'B', 'C', 'D'];
    for (var oi = 0; oi < q.options.length; oi++) {
      html += '<div class="filter-chip" style="padding:14px 16px;text-align:left;font-size:15px;cursor:pointer;justify-content:flex-start" onclick="submitTopikChoice(' + oi + ', this)">';
      html += '<span style="font-weight:700;color:var(--primary);min-width:24px">' + labels[oi] + '.</span> ';
      html += '<span>' + q.options[oi] + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '</div>';

  // Nav buttons
  html += '<div style="display:flex;gap:8px;margin-top:12px">';
  if (topikState.idx > 0) {
    html += '<button class="qs-start-btn" style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border)" onclick="topikState.idx--;renderTopikQuestion()">← 上一题</button>';
  }
  html += '<button class="qs-start-btn" style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border)" onclick="renderTopik()">结束测试</button>';
  html += '</div>';

  page.innerHTML = html;
  renderReviewNav();

  // Focus input if fill type
  if (q.type === 'grammar' && q.options.length === 0) {
    setTimeout(function() {
      var inp = document.getElementById('topikFillInput');
      if (inp) inp.focus();
    }, 100);
  }
}

function submitTopikChoice(choiceIdx, el) {
  var q = topikState.questions[topikState.idx];
  var correct = choiceIdx === q.ans;
  topikState.answers[topikState.idx] = choiceIdx === q.ans ? 1 : 0;

  // Flash feedback
  if (el) {
    el.style.transition = 'all 0.3s';
    el.style.borderColor = correct ? '#22c55e' : '#ef4444';
    el.style.background = correct ? '#f0fdf4' : '#fef2f2';
  }
  var page = document.getElementById('reviewContent');
  var feedbackHtml = '<div style="padding:12px;margin-top:8px;border-radius:8px;font-size:14px;' + (correct ? 'background:#f0fdf4;color:#16a34a' : 'background:#fef2f2;color:#dc2626') + '">'
    + (correct ? '✅ 正确！' : '❌ 错误！正确答案：' + q.correctText)
    + '</div>';
  var cardEl = page.querySelector('[style*="border-radius:var(--radius)"]');
  if (cardEl) {
    cardEl.insertAdjacentHTML('beforeend', feedbackHtml);
  }

  // Disable all option buttons
  var chips = page.querySelectorAll('.filter-chip');
  chips.forEach(function(c, i) {
    c.style.pointerEvents = 'none';
    c.style.opacity = i === q.ans ? '1' : '0.5';
  });

  setTimeout(function() {
    advanceTopik();
  }, 1200);
}

function submitTopikFill() {
  var inp = document.getElementById('topikFillInput');
  if (!inp) return;
  var userAnswer = inp.value.trim();
  var q = topikState.questions[topikState.idx];
  var correct = userAnswer.toLowerCase() === q.correctText.toLowerCase();
  topikState.answers[topikState.idx] = correct ? 1 : 0;

  var page = document.getElementById('reviewContent');
  inp.disabled = true;
  var feedbackHtml = '<div style="padding:12px;margin-top:8px;border-radius:8px;font-size:14px;' + (correct ? 'background:#f0fdf4;color:#16a34a' : 'background:#fef2f2;color:#dc2626') + '">'
    + '你的答案：<b>' + userAnswer + '</b><br>'
    + (correct ? '✅ 正确！' : '❌ 答案：' + q.correctText)
    + '</div>';
  var cardEl = page.querySelector('[style*="border-radius:var(--radius)"]');
  if (cardEl) cardEl.insertAdjacentHTML('beforeend', feedbackHtml);

  setTimeout(function() {
    advanceTopik();
  }, 1500);
}

function advanceTopik() {
  topikState.idx++;
  if (topikState.idx >= topikState.questions.length) {
    renderTopikResult();
  } else {
    renderTopikQuestion();
  }
}

function renderTopikResult() {
  var page = document.getElementById('reviewContent');
  var total = topikState.questions.length;
  var score = 0;
  for (var i = 0; i < topikState.answers.length; i++) {
    if (topikState.answers[i] === 1) score++;
  }
  var pct = Math.round((score / total) * 100);
  var pctCorrect = Math.round((score / total) * 100);

  // Level mapping
  var level, levelDesc, levelColor, levelEmoji;
  if (pct >= 95) { level = '6급'; levelDesc = '高级·精通'; levelColor = '#7c3aed'; levelEmoji = '👑'; }
  else if (pct >= 85) { level = '5급'; levelDesc = '高级·流利'; levelColor = '#2563eb'; levelEmoji = '🌟'; }
  else if (pct >= 70) { level = '4급'; levelDesc = '中高级'; levelColor = '#16a34a'; levelEmoji = '📗'; }
  else if (pct >= 55) { level = '3급'; levelDesc = '中级'; levelColor = '#ca8a04'; levelEmoji = '📙'; }
  else if (pct >= 40) { level = '2급'; levelDesc = '初级上'; levelColor = '#ea580c'; levelEmoji = '📒'; }
  else { level = '1급'; levelDesc = '初级入门'; levelColor = '#dc2626'; levelEmoji = '📕'; }

  var html = '<div style="font-size:16px;font-weight:600;margin-bottom:16px">🏆 测试结果</div>';

  // Score card
  html += '<div style="background:var(--card);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:12px">';
  html += '<div style="font-size:64px;margin-bottom:8px">' + levelEmoji + '</div>';
  html += '<div style="font-size:36px;font-weight:800;color:' + levelColor + ';margin-bottom:4px">' + level + '</div>';
  html += '<div style="font-size:16px;color:' + levelColor + ';margin-bottom:16px">' + levelDesc + '</div>';
  html += '<div style="display:flex;gap:12px;justify-content:center;margin-bottom:8px">';
  html += '<div style="background:var(--bg);border-radius:12px;padding:12px 20px"><div style="font-size:24px;font-weight:700;color:var(--primary)">' + score + '</div><div style="font-size:11px;color:var(--text-light)">正确</div></div>';
  html += '<div style="background:var(--bg);border-radius:12px;padding:12px 20px"><div style="font-size:24px;font-weight:700;color:var(--text-secondary)">' + total + '</div><div style="font-size:11px;color:var(--text-light)">总题数</div></div>';
  html += '<div style="background:var(--bg);border-radius:12px;padding:12px 20px"><div style="font-size:24px;font-weight:700;color:var(--primary)">' + pctCorrect + '%</div><div style="font-size:11px;color:var(--text-light)">正确率</div></div>';
  html += '</div>';

  // Progress bar
  html += '<div style="height:12px;background:var(--border);border-radius:6px;margin-top:8px">';
  html += '<div style="height:12px;background:' + levelColor + ';border-radius:6px;width:' + pct + '%"></div>';
  html += '</div>';
  html += '</div>';

  // Category breakdown
  var cats = {};
  for (var ci = 0; ci < topikState.questions.length; ci++) {
    var cq = topikState.questions[ci];
    var typeLabel = cq.type === 'vocab' ? '词汇' : cq.type === 'grammar' ? '语法' : '阅读';
    if (!cats[typeLabel]) cats[typeLabel] = { total: 0, correct: 0 };
    cats[typeLabel].total++;
    if (topikState.answers[ci] === 1) cats[typeLabel].correct++;
  }

  html += '<div style="background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px">';
  html += '<div style="font-size:14px;font-weight:600;margin-bottom:10px">📊 分类统计</div>';
  var catKeys = Object.keys(cats);
  for (var ck = 0; ck < catKeys.length; ck++) {
    var cat = cats[catKeys[ck]];
    var catPct = Math.round((cat.correct / cat.total) * 100);
    var catColor = catPct >= 70 ? '#16a34a' : catPct >= 40 ? '#ca8a04' : '#dc2626';
    html += '<div style="display:flex;align-items:center;margin-bottom:8px;font-size:13px">';
    html += '<span style="min-width:50px;font-weight:600">' + catKeys[ck] + '</span>';
    html += '<div style="flex:1;height:8px;background:var(--border);border-radius:4px;margin:0 8px"><div style="height:8px;background:' + catColor + ';border-radius:4px;width:' + catPct + '%"></div></div>';
    html += '<span style="min-width:50px;text-align:right;color:' + catColor + '">' + cat.correct + '/' + cat.total + '</span>';
    html += '</div>';
  }
  html += '</div>';

  // Recommendations
  html += '<div style="background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px">';
  html += '<div style="font-size:14px;font-weight:600;margin-bottom:8px">💡 学习建议</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);line-height:1.8">';
  if (pct >= 85) html += '🎉 非常优秀！你已经达到高级水平，建议多阅读韩语新闻和原著小说巩固。';
  else if (pct >= 70) html += '👍 表现不错！建议多做中高级语法练习，扩大词汇量至3000+词。';
  else if (pct >= 55) html += '📚 中级水平。重点突破间接引用、使动被动、连接词尾等中高级语法。';
  else if (pct >= 40) html += '📖 初级阶段。建议每天背诵20个单词，系统学习基本句型和时态。';
  else html += '🌱 入门阶段。建议先熟悉韩文字母（한글），掌握基本发音规则后再开始词汇学习。';
  html += '</div>';
  html += '</div>';

  // Buttons
  html += '<div style="display:flex;gap:8px">';
  html += '<button class="qs-start-btn" style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border)" onclick="renderTopik()">返回设置</button>';
  html += '<button class="qs-start-btn" style="flex:1" onclick="startTopikTest()">再来一次</button>';
  html += '</div>';

  page.innerHTML = html;
  renderReviewNav();
}

// Helper: shuffle array (if not already defined)
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}


init();
</script>
</body>
</html>
